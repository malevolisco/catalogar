name: Publicar version

# Cada etiqueta vX (por ejemplo v2026.10.04) publica una release con:
#   catalogator-app.zip   el codigo y el criterio (lo que Catalogator.exe se baja y actualiza solo)
#   Catalogator.exe       el lanzador compilado en Windows (solo hay que bajarlo una vez)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Etiqueta de la version (vAAAA.MM.DD)"
        required: true

permissions:
  contents: write

jobs:
  publicar:
    # a mano, solo desde main (lo ya aprobado): nunca desde otra rama
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Version
        id: v
        shell: bash
        # la version pedida a mano entra como variable, nunca dentro de la orden, y solo con forma vAAAA.MM.DD[.N]
        env:
          VERSION_PEDIDA: ${{ github.event.inputs.version }}
        run: |
          V="${GITHUB_REF_NAME}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then V="$VERSION_PEDIDA"; fi
          if ! [[ "$V" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
            echo "Version no valida: tiene que ser vAAAA.MM.DD o vAAAA.MM.DD.N"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "EXE_VERSION = \"$V\"" > catalogator_version.py
      - name: Librerias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Pruebas (si falla alguna, no se publica)
        run: |
          pip install pytest
          python -m pytest tests -q
      - name: Zip de la app
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: python empaquetar.py "$VERSION"
      - name: Compilar Catalogator.exe
        run: pyinstaller --noconfirm catalogator.spec
      - name: Comprobar que arranca
        shell: bash
        run: |
          ./dist/Catalogator.exe --actualizar || true
          ls -la dist
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.version }}
          name: ${{ steps.v.outputs.version }}
          generate_release_notes: true
          files: |
            dist/catalogator-app.zip
            dist/Catalogator.exe
