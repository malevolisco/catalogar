name: Pruebas

# En cada PR y en cada cambio de main: si alguna prueba falla, se ve antes de publicar.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Librerias
        run: pip install -r requirements.txt pytest
      - name: Pruebas
        run: python -m pytest tests -q
