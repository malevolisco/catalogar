name: Catalogator en la nube

# Contesta los correos con CSV mandados a la direccion +csv de la cuenta de Catalogator, sin ningun equipo
# encendido. Ver NUBE.md. Lo arranca el timbre (nube_timbre.gs): al llegar un CSV, el dueño del repositorio
# cambia el texto del issue 64. La vuelta cada 10 minutos es solo respaldo (GitHub la retrasa horas).
# El registro de esta pagina es publico: nube.py solo escribe cuentas, nunca textos ni direcciones.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  issues:
    types: [edited]

# nunca dos a la vez: si una vuelta tarda (una lista larga), la siguiente espera
concurrency:
  group: nube
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nube:
    # de los issues, solo el del timbre y cambiado por el dueño (cualquiera puede abrir issues: no arrancan nada)
    if: github.event_name != 'issues' || (github.event.issue.number == 64 && github.event.sender.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Librerias
        run: pip install requests openpyxl
      - name: Correos
        env:
          CATALOGATOR_CORREO: ${{ secrets.CATALOGATOR_CORREO }}
          CATALOGATOR_CLAVE: ${{ secrets.CATALOGATOR_CLAVE }}
          CATALOGATOR_CLAUDE_TOKEN: ${{ secrets.CATALOGATOR_CLAUDE_TOKEN }}
          CATALOGATOR_API_KEY: ${{ secrets.CATALOGATOR_API_KEY }}
          CATALOGATOR_OPENAI_KEY: ${{ secrets.CATALOGATOR_OPENAI_KEY }}
        run: python nube.py
